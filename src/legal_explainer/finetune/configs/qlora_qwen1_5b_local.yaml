# Local QLoRA recipe for the LegalPolicy_LLM project — Qwen 2.5 1.5B Instruct.
# Sized for a 6 GB consumer GPU (RTX 3050 Laptop) on WSL2.
# For the 3B variant on a Colab T4 see notebooks/qlora_qwen2_5_3b_colab.ipynb
# (or the qlora_r32.yaml recipe if you wire up the local trainer to a cloud GPU).

base_model: Qwen/Qwen2.5-1.5B-Instruct
adapter_name: qlora-qwen2.5-1.5b-v1
output_dir: runs/qlora-qwen2.5-1.5b-v1

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16        # effective batch = 16
  learning_rate: 3.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.06
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  max_seq_length: 1024
  packing: false
  logging_steps: 5
  eval_strategy: epoch          # must match save_strategy when load_best_model_at_end=true (transformers 5.x)
  eval_steps: 50                # ignored when eval_strategy=epoch, kept for forward compat
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 5
  seed: 13

data:
  train_jsonl: data/qa_pairs.jsonl
  val_jsonl: data/qa_pairs_val.jsonl
